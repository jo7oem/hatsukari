---
services:
  app:
    image: "golang:1.26"
    command: "./dev_tools/bin/air -c .air.toml"
    working_dir: /app
    volumes:
      - ./:/app
      - modcache:/go/pkg/mod
      - build_cache:/root/.cache/go-build
    environment:
      HATSUKARI_ADDR: ":8080"
      HATSUKARI_SITE_DIR: "sample"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      - otel-collector
    ports:
      - "127.0.0.1:2345:2345"
      - "8080:8080"

  otel-collector:
    image: "otel/opentelemetry-collector-contrib:0.151.0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger
      - tempo
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"

  jaeger:
    image: "jaegertracing/all-in-one:1.64.0"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  tempo:
    image: "grafana/tempo:2.8.2"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./otel/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"

  grafana:
    image: "grafana/grafana:11.6.1"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./otel/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - tempo
      - prometheus
    ports:
      - "3000:3000"

  prometheus:
    image: "prom/prometheus:v3.5.0"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./otel/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - otel-collector
    ports:
      - "9090:9090"
volumes:
  modcache:
  build_cache:

